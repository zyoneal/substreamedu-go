global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/gateway/actuator/prometheus'

  - job_name: 'iam-service'
    static_configs:
      - targets: ['iam-service:3002']
    metrics_path: '/auth-service/actuator/prometheus'

  - job_name: 'dictionary-service'
    static_configs:
      - targets: ['dictionary-service:3003']
    metrics_path: '/dictionary-service/actuator/prometheus'

  - job_name: 'media-service'
    static_configs:
      - targets: ['media-service:3004']
    metrics_path: '/media-service/actuator/prometheus'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3005']
    metrics_path: '/notification-service/actuator/prometheus'
