openapi: 3.0.3
info:
  title: SubStreamEdu IAM Service API
  version: 1.0.0
  description: Authentication, Authorization, User Profile, and Account Quota Management.

servers:
  - url: /api/auth
    description: Public Gateway routed path for Auth
  - url: /api/users
    description: Public Gateway routed path for User Profile
  - url: http://iam-service:3002/auth-service
    description: Internal direct service address

paths:
  /auth/login:
    post:
      summary: User Login
      description: Authenticates user credentials and issues JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/google:
    post:
      summary: Google OAuth Authentication
      description: Validates Google OAuth ID token and issues user session JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserProfile'

  /auth/promo:
    post:
      summary: Apply Promo Code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Promo code successfully activated

  /users/{userId}:
    get:
      summary: Get User Profile Details
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /auth/internal/user/{userId}/usage:
    get:
      summary: Get User AI / Translation Usage Quota
      security:
        - internalKeyAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current user quota metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  translationsCount:
                    type: integer
                  savedWordsCount:
                    type: integer
                  isPremium:
                    type: boolean

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalKeyAuth:
      type: apiKey
      in: header
      name: X-Internal-Service-Key

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, TEACHER, SYSTEM_ADMIN]
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
