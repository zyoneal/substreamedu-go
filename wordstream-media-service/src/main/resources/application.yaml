server:
  port: 3004
  servlet:
    context-path: /media-service

spring:
  application:
    name: wordstream-media-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB_MEDIA:wordstream_media}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      youtube-subtitle:
        registerHealthMap: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      youtubeApi:
        registerHealthMap: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      spotifyApi:
        registerHealthMap: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      youtube-subtitle:
        maxAttempts: 3
        waitDuration: 1s
      youtubeApi:
        maxAttempts: 3
        waitDuration: 2s
      spotifyApi:
        maxAttempts: 3
        waitDuration: 2s

# API Properties
youtube:
  api:
    key: ${YOUTUBE_API_KEY}
spotify:
  client-id: ${SPOTIFY_CLIENT_ID}
  client-secret: ${SPOTIFY_CLIENT_SECRET}
subdl:
  api-key: ${SUBDL_API_KEY}
  base-url: https://api.subdl.com/api/v1
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
