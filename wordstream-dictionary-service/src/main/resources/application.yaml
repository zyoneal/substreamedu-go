server:
  port: 3003
  servlet:
    context-path: /dictionary-service

spring:
  application:
    name: wordstream-dictionary-service
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB_DICTIONARY:wordstream_dictionary}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: dictionary-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.substreamedu.dictionary.dto.event"
    producer:
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      deepseek-api:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
  bulkhead:
    instances:
      deepseek-api:
        maxConcurrentCalls: 25
        maxWaitDuration: 2s
      noun-project-api:
        maxConcurrentCalls: 10
        maxWaitDuration: 1s
  retry:
    instances:
      deepseek-api:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException

# External API URLs
external-api:
  skyeng-api-url: https://dictionary.skyeng.ru/api/public/v1/words
  noun-project-api-url: https://api.thenounproject.com/v2/icon
  noun-project-api-key: ${NOUN_PROJECT_API_KEY}
  noun-project-api-secret: ${NOUN_PROJECT_API_SECRET}

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
