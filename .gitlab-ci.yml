variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: $CI_REGISTRY
  IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  GO_VERSION: "1.24"

stages:
  - lint
  - test
  - build
  - package
  - deploy

.go-base:
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git ca-certificates
    - go version

.go-docker-build:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  stage: package
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG $SERVICE_PATH
    - docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG
    - if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest;
        docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest;
      fi

# --- LINT STAGE ---
golangci-lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run --timeout 10m
  only:
    changes:
      - substreamedu-*-go/**/*.go
      - .golangci.yml

govulncheck:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  allow_failure: true
  only:
    changes:
      - substreamedu-*-go/**/*.go
      - substreamedu-*-go/go.mod
      - substreamedu-*-go/go.sum

go-mod-verify:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - for dir in substreamedu-*-go; do (cd "$dir" && go mod verify); done

# --- TEST STAGE ---
.unit-test:
  extends: .go-base
  stage: test
  script:
    - cd $SERVICE_PATH
    - go mod download
    - go vet ./...
    - go test -v -race -count=1 -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out

iam-test:
  extends: .unit-test
  variables:
    SERVICE_PATH: substreamedu-iam-service-go

dictionary-test:
  extends: .unit-test
  variables:
    SERVICE_PATH: substreamedu-dictionary-service-go

media-test:
  extends: .unit-test
  variables:
    SERVICE_PATH: substreamedu-media-service-go

notification-test:
  extends: .unit-test
  variables:
    SERVICE_PATH: substreamedu-notification-service-go

gateway-test:
  extends: .unit-test
  variables:
    SERVICE_PATH: substreamedu-gateway-go

# --- BUILD STAGE ---
.go-build:
  extends: .go-base
  stage: build
  script:
    - cd $SERVICE_PATH
    - go mod download
    - CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./...

iam-build:
  extends: .go-build
  variables:
    SERVICE_PATH: substreamedu-iam-service-go

dictionary-build:
  extends: .go-build
  variables:
    SERVICE_PATH: substreamedu-dictionary-service-go

media-build:
  extends: .go-build
  variables:
    SERVICE_PATH: substreamedu-media-service-go

notification-build:
  extends: .go-build
  variables:
    SERVICE_PATH: substreamedu-notification-service-go

gateway-build:
  extends: .go-build
  variables:
    SERVICE_PATH: substreamedu-gateway-go

# --- PACKAGE STAGE (Docker) ---
iam-package:
  extends: .go-docker-build
  variables:
    SERVICE_NAME: "iam-service"
    SERVICE_PATH: "substreamedu-iam-service-go"

dictionary-package:
  extends: .go-docker-build
  variables:
    SERVICE_NAME: "dictionary-service"
    SERVICE_PATH: "substreamedu-dictionary-service-go"

media-package:
  extends: .go-docker-build
  variables:
    SERVICE_NAME: "media-service"
    SERVICE_PATH: "substreamedu-media-service-go"

notification-package:
  extends: .go-docker-build
  variables:
    SERVICE_NAME: "notification-service"
    SERVICE_PATH: "substreamedu-notification-service-go"

gateway-package:
  extends: .go-docker-build
  variables:
    SERVICE_NAME: "gateway"
    SERVICE_PATH: "substreamedu-gateway-go"

# --- FRONTEND ---
frontend-package:
  extends: .go-docker-build
  variables:
    SERVICE_NAME: "frontend"
    SERVICE_PATH: "substreamedu-frontend"

# --- DEPLOY ---
deploy-prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_HOST "cd /app && ./deploy.sh"
  only:
    - main
  when: on_success

