apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: gateway
        image: ghcr.io/zyoneal/subsreamedu/gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: IAM_SERVICE_HOST
          value: "http://iam-service:3002"
        - name: DICTIONARY_SERVICE_HOST
          value: "http://dictionary-service:3003"
        - name: MEDIA_SERVICE_HOST
          value: "http://media-service:3004"
        - name: NOTIFICATION_SERVICE_HOST
          value: "http://notification-service:3005"
        - name: REDIS_HOST
          value: "redis"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: ["ALL"]
          allowPrivilegeEscalation: false
        resources:
          limits:
            cpu: "200m"
            memory: "64Mi"
          requests:
            cpu: "100m"
            memory: "32Mi"
        livenessProbe:
          httpGet:
            path: /gateway/actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /gateway/actuator/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
