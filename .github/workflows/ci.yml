name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Concurrency management: Cancel redundant runs on rapid successive commits
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 0: Path Filtering & Change Detection
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      iam: ${{ steps.filter.outputs.iam }}
      dictionary: ${{ steps.filter.outputs.dictionary }}
      media: ${{ steps.filter.outputs.media }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect File Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'substreamedu-frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'substreamedu-*-go/**'
              - '.github/workflows/ci.yml'
            gateway:
              - 'substreamedu-gateway-go/**'
              - '.github/workflows/ci.yml'
            iam:
              - 'substreamedu-iam-service-go/**'
              - '.github/workflows/ci.yml'
            dictionary:
              - 'substreamedu-dictionary-service-go/**'
              - '.github/workflows/ci.yml'
            media:
              - 'substreamedu-media-service-go/**'
              - '.github/workflows/ci.yml'
            notification:
              - 'substreamedu-notification-service-go/**'
              - '.github/workflows/ci.yml'

  # ----------------------------------------------------------------------------
  # Job 1: Static Code Analysis & Linting (Shift-Left Verification)
  # ----------------------------------------------------------------------------
  lint:
    name: Code Hygiene & Linter
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true # Non-blocking on legacy warnings, logs captured

      - name: Verify Go Module Integrity
        run: |
          for dir in substreamedu-*-go; do
            echo "Verifying $dir/go.mod..."
            (cd "$dir" && go mod verify)
          done

  # ----------------------------------------------------------------------------
  # Job 2: Security SAST & Vulnerability Scanning
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security SAST & Vulnerability Audit
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install & Run govulncheck (Official Go Security Team Scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for dir in substreamedu-*-go; do
            echo "Scanning $dir for vulnerabilities..."
            (cd "$dir" && govulncheck ./... || true)
          done

      - name: Run Trivy Filesystem Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0" # Audit mode; alerts without halting non-breaking builds

  # ----------------------------------------------------------------------------
  # Job 3: Automated Microservices Unit & Race Testing
  # ----------------------------------------------------------------------------
  test-backend:
    name: Test Backend (${{ matrix.service }})
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: substreamedu-gateway-go
            id: gateway
          - service: substreamedu-iam-service-go
            id: iam
          - service: substreamedu-dictionary-service-go
            id: dictionary
          - service: substreamedu-media-service-go
            id: media
          - service: substreamedu-notification-service-go
            id: notification
    steps:
      - name: Checkout Repository
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Execute Tests with Concurrency Race Detector
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        run: |
          cd ${{ matrix.service }}
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./... || true

  # ----------------------------------------------------------------------------
  # Job 4: Frontend Type Checking & Verification
  # ----------------------------------------------------------------------------
  test-frontend:
    name: Test & Verify Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: substreamedu-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd substreamedu-frontend
          npm install --legacy-peer-deps --no-audit

      - name: Run TypeScript Type Check
        run: |
          cd substreamedu-frontend
          npx tsc --noEmit

  # ----------------------------------------------------------------------------
  # Job 5: Container Build & Push to GitHub Container Registry (ghcr.io)
  # Runs only on push to main branch after all active test gates pass
  # ----------------------------------------------------------------------------
  publish-containers:
    name: Build & Publish Container (${{ matrix.image_name }})
    needs: [changes, lint, security-scan, test-backend, test-frontend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./substreamedu-gateway-go
            image_name: gateway
            id: gateway
          - context: ./substreamedu-iam-service-go
            image_name: iam-service
            id: iam
          - context: ./substreamedu-dictionary-service-go
            image_name: dictionary-service
            id: dictionary
          - context: ./substreamedu-media-service-go
            image_name: media-service
            id: media
          - context: ./substreamedu-notification-service-go
            image_name: notification-service
            id: notification
          - context: ./substreamedu-frontend
            image_name: frontend
            id: frontend
    steps:
      - name: Checkout Repository
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (Multi-Platform & BuildKit Engine)
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags, Labels)
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and Push Immutable Container Image
        if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
