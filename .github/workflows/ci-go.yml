name: Go CI

on:
  push:
    paths:
      - 'substreamedu-*-go/**'
  pull_request:
    paths:
      - 'substreamedu-*-go/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          'substreamedu-iam-service-go',
          'substreamedu-notification-service-go',
          'substreamedu-media-service-go',
          'substreamedu-dictionary-service-go',
          'substreamedu-gateway-go'
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Go Mod Tidy
        run: cd ${{ matrix.service }} && go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ${{ matrix.service }}
          args: --timeout=5m
        continue-on-error: true

      - name: Run Tests
        run: cd ${{ matrix.service }} && go test -v ./...
