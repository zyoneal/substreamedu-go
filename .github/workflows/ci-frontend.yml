name: Frontend CI

on:
  push:
    paths:
      - 'substreamedu-frontend/**'
  pull_request:
    paths:
      - 'substreamedu-frontend/**'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: substreamedu-frontend/package-lock.json

      - name: Install dependencies
        run: cd substreamedu-frontend && npm ci

      - name: Run Lint
        run: cd substreamedu-frontend && npm run lint

      - name: Run Tests
        run: cd substreamedu-frontend && npm test -- --watchAll=false

      - name: Run Build
        run: cd substreamedu-frontend && npm run build
        env:
          CI: false
