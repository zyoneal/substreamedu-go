server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Explicitly handle static assets to avoid fallback to index.html (which causes MIME errors)
    location /static/ {
        try_files $uri =404;
        expires 1y;
        # access_log off;
        add_header Cache-Control "public";
    }

    # Handle other assets like images, fonts
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|avif|webp)$ {
        try_files $uri =404;
        expires 1y;
        # access_log off;
        add_header Cache-Control "public";
    }

    # SPA Routing: Fallback to index.html for everything else
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
